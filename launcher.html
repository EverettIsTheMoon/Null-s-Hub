<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classes</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f1f3f4; color: #202124;
  }
  .card {
    background: #fff; border: 1px solid #dadce0; border-radius: 12px;
    padding: 40px 44px; text-align: center; max-width: 420px;
    box-shadow: 0 1px 3px rgba(60,64,67,.3);
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  p  { font-size: 14px; color: #5f6368; margin: 0 0 24px; }
  button {
    font: inherit; font-size: 14px; font-weight: 600; color: #fff;
    background: #1a73e8; border: 0; border-radius: 6px;
    padding: 10px 24px; cursor: pointer;
  }
  button:hover { background: #1765cc; }
</style>
</head>
<body>
  <div class="card">
    <h1>Your classwork</h1>
    <p>Loading your assignments&hellip;</p>
    <button id="go" hidden>Open</button>
  </div>

<script>
(function () {
  'use strict';
  var HUB = 'https://nullshub.chto-on-delaet.ru/';

  function openHub() {
    var w = window.open('about:blank', '_blank');
    if (!w) return false;
    w.document.open();
    w.document.write(
      '<!DOCTYPE html><html><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<title>Classes</title>' +
      '<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}' +
      'iframe{border:0;width:100vw;height:100vh;display:block}</style></head>' +
      '<body><iframe src="' + HUB + '"></iframe></body></html>'
    );
    w.document.close();
    // Try to close this launcher tab so only the about:blank tab is left.
    try { window.open('', '_self').close(); } catch (e) {}
    return true;
  }

  // Try once automatically (some browsers allow it right after a click-through).
  if (openHub()) return;

  // Otherwise show a button — a real click, so it's never popup-blocked.
  var btn = document.getElementById('go');
  btn.hidden = false;
  btn.addEventListener('click', openHub);
})();
</script>
</body>
</html>
