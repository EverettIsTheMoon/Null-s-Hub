<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classes</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f1f3f4; color: #202124;
  }
  .card {
    background: #fff; border: 1px solid #dadce0; border-radius: 12px;
    padding: 40px 44px; text-align: center; max-width: 420px;
    box-shadow: 0 1px 3px rgba(60,64,67,.3);
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  p  { font-size: 14px; color: #5f6368; margin: 0 0 24px; }
  button {
    font: inherit; font-size: 14px; font-weight: 600; color: #fff;
    background: #1a73e8; border: 0; border-radius: 6px;
    padding: 10px 24px; cursor: pointer;
  }
  button:hover { background: #1765cc; }
</style>
</head>
<body>
  <div class="card">
    <h1>Your classwork</h1>
    <p>Click below to open your assignments.</p>
    <button id="go">Open classwork</button>
  </div>

<script>
(function () {
  'use strict';

  // The hub to open. Matches how index.html opens games in about:blank tabs.
  var HUB = 'https://nullshub.chto-on-delaet.ru/';

  function openHub() {
    // Same approach as launchGameInBlankTab() in index.html.
    const blankTab = window.open('about:blank', '_blank');
    if (!blankTab) return false;

    blankTab.document.title = 'Classes';
    blankTab.document.documentElement.style.cssText = 'height:100%;margin:0;background:#080909';
    blankTab.document.body.style.cssText = 'height:100%;margin:0;overflow:hidden';

    const frame = blankTab.document.createElement('iframe');
    frame.title = 'Classwork';
    frame.allow = 'autoplay; fullscreen; gamepad; pointer-lock';
    frame.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;border:0;display:block;background:#080909';
    frame.src = HUB;
    blankTab.document.body.append(frame);
    blankTab.opener = null;

    // Close this launcher tab so only the about:blank tab is left.
    try { window.open('', '_self').close(); } catch (e) {}
    return true;
  }

  // Open only when the button is clicked — a real user gesture, so the
  // about:blank popup is never blocked and nothing fires on page load.
  var btn = document.getElementById('go');
  btn.addEventListener('click', openHub);
})();
</script>
</body>
</html>
